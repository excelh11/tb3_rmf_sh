# FLEET CONFIG =================================================================
# Fleet "sh_cleanerBotA": 1 CleanerBotA on L1 of the sh_delivery building.
# Its own named waypoints (cleanerBotA_charger, clean_west_point) and lanes
# (graph_idx 1) share the same physical corridor (L1_hall_west <-> L1_hall_center)
# as the sh_tinyRobot fleet's graph_idx 0 lanes, by design — this lets the two
# fleets' robots meet and demonstrate RMF's traffic negotiation.
# Adapted from rmf_demos config/hotel/cleanerBotA_config.yaml (Apache License 2.0).

rmf_fleet:
  name: "sh_cleanerBotA"
  limits:
    linear: [0.5, 0.75] # velocity, acceleration
    angular: [0.6, 2.0] # velocity, acceleration
  profile: # Robot profile is modelled as a circle
    footprint: 0.4 # radius in m
    vicinity: 0.6 # radius in m
  reversible: True # whether robots in this fleet can reverse
  battery_system:
    voltage: 12.0 # V
    capacity: 24.0 # Ahr
    charging_current: 5.0 # A
  mechanical_system:
    mass: 20.0 # kg
    moment_of_inertia: 10.0 #kgm^2
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0 # W
  tool_system:
    power: 0.0 # W
  recharge_threshold: 0.10 # Battery level below which robots in this fleet will not operate
  recharge_soc: 1.0 # Battery level to which robots in this fleet should be charged up to during recharging tasks
  publish_fleet_state: 10.0 # Publish frequency for fleet state, ensure that it is same as robot_state_update_frequency
  account_for_battery_drain: True
  task_capabilities: # Specify the types of RMF Tasks that robots in this fleet are capable of performing
    loop: True
    delivery: False
  actions: []
  finishing_request: "park" # [park, charge, nothing]
  responsive_wait: True # Should responsive wait be on/off for the whole fleet by default? False if not specified.
  reassign_task_interval: 120 # seconds, specify how often a task reassignment should be triggered in the fleet
  robots:
    # names must match spawn_robot_name in sh_delivery.building.yaml
    cleanerBotA_1:
        charger: "cleanerBotA_charger"

fleet_manager:
  ip: "127.0.0.1"
  port: 22012
  user: "some_user"
  password: "some_password"
